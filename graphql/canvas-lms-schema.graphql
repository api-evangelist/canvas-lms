"""
Canvas LMS GraphQL Schema
Endpoint: https://<canvas-install-url>/api/graphql
Explorer:  https://<canvas-install-url>/graphiql
Docs:      https://canvas.instructure.com/doc/api/file.graphql.html

Authentication: OAuth2 Bearer token (same developer keys as REST API).
Permissions mirror the Canvas REST API permission model.

This schema is derived from the Canvas LMS open-source data model
(https://github.com/instructure/canvas-lms) and the published GraphQL
documentation. Canvas also ships a live introspection endpoint on any
self-hosted or Free-for-Teacher instance at /api/graphql.
"""

# ---------------------------------------------------------------------------
# Scalars
# ---------------------------------------------------------------------------

"""ISO 8601 date-time string."""
scalar DateTime

"""An opaque global node ID (base64-encoded type:id)."""
scalar ID

"""A URL string."""
scalar URL

"""Arbitrary JSON blob."""
scalar JSON

# ---------------------------------------------------------------------------
# Interfaces
# ---------------------------------------------------------------------------

"""Every top-level Canvas object implements Node for Relay-style ID lookup."""
interface Node {
  id: ID!
}

"""Objects that carry a creation and modification timestamp."""
interface Timestamped {
  createdAt: DateTime
  updatedAt: DateTime
}

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

enum WorkflowState {
  active
  deleted
  unpublished
  published
  completed
  concluded
  pending
  invited
  creation_pending
}

enum EnrollmentType {
  StudentEnrollment
  TeacherEnrollment
  TaEnrollment
  DesignerEnrollment
  ObserverEnrollment
}

enum SubmissionType {
  online_text_entry
  online_url
  online_upload
  media_recording
  student_annotation
  none
  not_graded
  on_paper
  discussion_topic
  external_tool
}

enum GradingType {
  points
  percent
  letter_grade
  gpa_scale
  pass_fail
  not_graded
}

enum DiscussionType {
  side_comment
  threaded
}

enum ModuleItemType {
  Assignment
  Quiz
  File
  Page
  Discussion
  ExternalUrl
  ExternalTool
  SubHeader
}

enum SubmissionStatus {
  submitted
  unsubmitted
  graded
  pending_review
  excused
  missing
  late
}

enum OutcomeCalculationMethod {
  decaying_average
  n_mastery
  latest
  highest
  average
}

enum AssignmentGroupWeightScheme {
  percent
  points
}

enum FileCategory {
  image
  video
  audio
  document
  other
}

# ---------------------------------------------------------------------------
# Core Types
# ---------------------------------------------------------------------------

"""
A Canvas root account or sub-account.
REST equivalent: GET /api/v1/accounts/:id
"""
type Account implements Node & Timestamped {
  id: ID!
  name: String!
  sisId: String
  integrationId: String
  parentAccountId: ID
  rootAccountId: ID!
  workflowState: WorkflowState!
  defaultTimeZone: String
  subAccountCount: Int
  courseCount: Int
  createdAt: DateTime
  updatedAt: DateTime

  parentAccount: Account
  rootAccount: Account
  subAccounts(first: Int, after: String): SubAccountConnection
  courses(first: Int, after: String, state: [WorkflowState]): CourseConnection
  users(first: Int, after: String): UserConnection
  roles(first: Int, after: String): RoleConnection
  terms(first: Int, after: String): TermConnection
  externalTools(first: Int, after: String): ExternalToolConnection
  groups(first: Int, after: String): GroupConnection
  outcomes(first: Int, after: String): OutcomeConnection
  outcomeGroups(first: Int, after: String): OutcomeGroupConnection
  features: [FeatureFlag]
}

"""A sub-account within an account hierarchy."""
type SubAccount implements Node & Timestamped {
  id: ID!
  name: String!
  parentAccountId: ID!
  rootAccountId: ID!
  workflowState: WorkflowState!
  sisId: String
  createdAt: DateTime
  updatedAt: DateTime

  parentAccount: Account
  courses(first: Int, after: String): CourseConnection
}

"""
A Canvas enrollment term (semester, quarter, academic year, etc.).
REST equivalent: GET /api/v1/accounts/:account_id/terms/:id
"""
type Term implements Node & Timestamped {
  id: ID!
  name: String!
  sisTermId: String
  startAt: DateTime
  endAt: DateTime
  workflowState: WorkflowState!
  createdAt: DateTime
  updatedAt: DateTime

  courses(first: Int, after: String): CourseConnection
}

"""
A Canvas course (the primary learning container).
REST equivalent: GET /api/v1/courses/:id
"""
type Course implements Node & Timestamped {
  id: ID!
  name: String!
  courseCode: String
  sisCourseId: String
  integrationId: String
  accountId: ID!
  rootAccountId: ID!
  enrollmentTermId: ID
  workflowState: WorkflowState!
  defaultView: String
  syllabuBody: String
  startAt: DateTime
  endAt: DateTime
  locale: String
  timeZone: String
  isPublic: Boolean
  isPublicSyllabus: Boolean
  restrictEnrollmentsToCourseDates: Boolean
  hideDistributionGraphs: Boolean
  allowStudentDiscussionTopics: Boolean
  allowStudentForumAttachments: Boolean
  allowStudentDiscussionEditing: Boolean
  allowStudentOrganizedGroups: Boolean
  createdAt: DateTime
  updatedAt: DateTime

  account: Account
  term: Term
  sections(first: Int, after: String): SectionConnection
  enrollments(first: Int, after: String, type: [EnrollmentType]): EnrollmentConnection
  assignments(first: Int, after: String, orderBy: [AssignmentOrderField]): AssignmentConnection
  assignmentGroups(first: Int, after: String): AssignmentGroupConnection
  submissions(first: Int, after: String, studentIds: [ID]): SubmissionConnection
  discussionTopics(first: Int, after: String): DiscussionConnection
  announcements(first: Int, after: String): AnnouncementConnection
  modules(first: Int, after: String): ModuleConnection
  files(first: Int, after: String): FileConnection
  folders(first: Int, after: String): FolderConnection
  pages(first: Int, after: String): ContentPageConnection
  groups(first: Int, after: String): GroupConnection
  groupCategories(first: Int, after: String): GroupCategoryConnection
  quizzes(first: Int, after: String): QuizConnection
  rubrics(first: Int, after: String): RubricConnection
  outcomes(first: Int, after: String): OutcomeConnection
  outcomeGroups(first: Int, after: String): OutcomeGroupConnection
  gradingPeriods(first: Int, after: String): GradingPeriodConnection
  gradingStandards(first: Int, after: String): GradingStandardConnection
  calendarEvents(first: Int, after: String): CalendarEventConnection
  externalTools(first: Int, after: String): ExternalToolConnection
  collaborations(first: Int, after: String): CollaborationConnection
  contentMigrations(first: Int, after: String): ContentMigrationConnection
  sisImports(first: Int, after: String): SISImportConnection
  permissions: CoursePermissions
}

"""Resolved permissions for the current user in a course context."""
type CoursePermissions {
  readAsSiteAdmin: Boolean
  manageGrades: Boolean
  manageAssignments: Boolean
  manageWiki: Boolean
  manageFiles: Boolean
  manageGroups: Boolean
  manageCalendar: Boolean
  manageCourseContent: Boolean
  sendMessages: Boolean
  viewAnalytics: Boolean
}

"""
A course section (roster sub-group within a course).
REST equivalent: GET /api/v1/courses/:course_id/sections/:id
"""
type Section implements Node & Timestamped {
  id: ID!
  name: String!
  sisSectionId: String
  integrationId: String
  courseId: ID!
  nonXlistCourseId: ID
  startAt: DateTime
  endAt: DateTime
  restrictEnrollmentsToSectionDates: Boolean
  workflowState: WorkflowState!
  defaultSection: Boolean
  enrollmentCount: Int
  createdAt: DateTime
  updatedAt: DateTime

  course: Course
  enrollments(first: Int, after: String): EnrollmentConnection
}

"""
A Canvas user account.
REST equivalent: GET /api/v1/users/:id
"""
type User implements Node & Timestamped {
  id: ID!
  name: String!
  sortableName: String
  shortName: String
  sisUserId: String
  integrationId: String
  loginId: String
  email: String
  locale: String
  timeZone: String
  bio: String
  avatarUrl: URL
  workflowState: WorkflowState!
  createdAt: DateTime
  updatedAt: DateTime

  profile: UserProfile
  enrollments(first: Int, after: String, courseId: ID): EnrollmentConnection
  groupMemberships(first: Int, after: String): GroupMembershipConnection
  submissions(first: Int, after: String): SubmissionConnection
  todos(first: Int, after: String): TodoConnection
  calendarEvents(first: Int, after: String): CalendarEventConnection
  roles(first: Int, after: String): RoleConnection
}

"""Extended profile data for a user."""
type UserProfile implements Node {
  id: ID!
  userId: ID!
  bio: String
  title: String
  pronouns: String
  avatarUrl: URL
  primaryEmail: String
  loginId: String
  sisId: String
  timeZone: String
  locale: String

  user: User
}

"""
An enrollment linking a user to a course in a given role.
REST equivalent: GET /api/v1/courses/:course_id/enrollments/:id
"""
type Enrollment implements Node & Timestamped {
  id: ID!
  courseId: ID!
  userId: ID!
  sectionId: ID
  type: EnrollmentType!
  workflowState: WorkflowState!
  role: String
  roleId: ID
  associatedUserId: ID
  limitPrivilegesToCourseSection: Boolean
  selfEnrolled: Boolean
  lastActivityAt: DateTime
  totalActivityTime: Int
  grades: Grade
  createdAt: DateTime
  updatedAt: DateTime

  course: Course
  user: User
  section: Section
}

"""Grade summary for an enrollment."""
type Grade {
  htmlUrl: URL
  currentScore: Float
  currentGrade: String
  finalScore: Float
  finalGrade: String
  overrideScore: Float
  overrideGrade: String
  unpostedCurrentScore: Float
  unpostedCurrentGrade: String
  unpostedFinalScore: Float
  unpostedFinalGrade: String
}

# ---------------------------------------------------------------------------
# Assignments & Submissions
# ---------------------------------------------------------------------------

"""Field to order assignments by."""
enum AssignmentOrderField {
  due_at
  position
  name
  created_at
  updated_at
}

"""
A Canvas assignment.
REST equivalent: GET /api/v1/courses/:course_id/assignments/:id
"""
type Assignment implements Node & Timestamped {
  id: ID!
  courseId: ID!
  assignmentGroupId: ID
  name: String!
  description: String
  dueAt: DateTime
  lockAt: DateTime
  unlockAt: DateTime
  pointsPossible: Float
  gradingType: GradingType!
  submissionTypes: [SubmissionType]
  position: Int
  published: Boolean!
  workflowState: WorkflowState!
  allowedExtensions: [String]
  allowedAttempts: Int
  maxNameLength: Int
  gradeGroupStudentsIndividually: Boolean
  anonymousGrading: Boolean
  anonymousInstructorAnnotations: Boolean
  omitFromFinalGrade: Boolean
  moderatedGrading: Boolean
  peerReviews: Boolean
  automaticPeerReviews: Boolean
  peerReviewCount: Int
  groupCategoryId: ID
  externalToolTagAttributes: ExternalToolTagAttributes
  rubricId: ID
  rubricSettings: RubricSettings
  htmlUrl: URL
  submissionsDownloadUrl: URL
  createdAt: DateTime
  updatedAt: DateTime

  course: Course
  assignmentGroup: AssignmentGroup
  rubric: Rubric
  submissions(first: Int, after: String, studentIds: [ID]): SubmissionConnection
  overrides(first: Int, after: String): AssignmentOverrideConnection
  outcomes(first: Int, after: String): OutcomeConnection
}

"""Settings reference linking an assignment to an external tool."""
type ExternalToolTagAttributes {
  url: URL
  resourceLinkId: String
  newTab: Boolean
}

"""Inline rubric configuration on an assignment."""
type RubricSettings {
  pointsPossible: Float
  freeFormCriterionComments: Boolean
  hideScoreTotal: Boolean
  useRubricForGrading: Boolean
}

"""
Differentiates assignment availability for specific users, sections, or groups.
REST equivalent: GET /api/v1/courses/:course_id/assignments/:assignment_id/overrides/:id
"""
type AssignmentOverride implements Node {
  id: ID!
  assignmentId: ID!
  title: String
  studentIds: [ID]
  groupId: ID
  courseSectionId: ID
  dueAt: DateTime
  unlockAt: DateTime
  lockAt: DateTime
  allDay: Boolean
  allDayDate: DateTime

  assignment: Assignment
  students: [User]
  group: Group
  section: Section
}

"""
A grouping of assignments within a course for weighting purposes.
REST equivalent: GET /api/v1/courses/:course_id/assignment_groups/:id
"""
type AssignmentGroup implements Node & Timestamped {
  id: ID!
  courseId: ID!
  name: String!
  position: Int
  groupWeight: Float
  rules: AssignmentGroupRules
  sisSourceId: String
  integrationData: JSON
  createdAt: DateTime
  updatedAt: DateTime

  course: Course
  assignments(first: Int, after: String): AssignmentConnection
}

"""Drop rules applied when computing weighted group scores."""
type AssignmentGroupRules {
  dropLowest: Int
  dropHighest: Int
  neverDrop: [ID]
}

"""
A student submission for an assignment.
REST equivalent: GET /api/v1/courses/:course_id/assignments/:assignment_id/submissions/:user_id
"""
type Submission implements Node & Timestamped {
  id: ID!
  assignmentId: ID!
  userId: ID!
  courseId: ID!
  attempt: Int
  body: String
  url: URL
  submissionType: SubmissionType
  workflowState: WorkflowState!
  submittedAt: DateTime
  gradedAt: DateTime
  graderId: ID
  score: Float
  grade: String
  late: Boolean
  missing: Boolean
  excused: Boolean
  gradeMatchesCurrentSubmission: Boolean
  previewUrl: URL
  attachments: [File]
  mediaComment: Media
  rubricAssessment: RubricAssessment
  latePolicyStatus: String
  pointsDeducted: Float
  postedAt: DateTime
  cachedDueDate: DateTime
  createdAt: DateTime
  updatedAt: DateTime

  assignment: Assignment
  user: User
  course: Course
  submissionHistory(first: Int, after: String): SubmissionHistoryConnection
  comments(first: Int, after: String): SubmissionCommentConnection
}

"""A historical version of a submission (re-submission)."""
type SubmissionHistory implements Node {
  id: ID!
  submissionId: ID!
  attempt: Int!
  body: String
  url: URL
  submissionType: SubmissionType
  submittedAt: DateTime
  score: Float
  grade: String
  gradedAt: DateTime
  attachments: [File]
}

"""A comment thread entry on a submission."""
type SubmissionComment implements Node & Timestamped {
  id: ID!
  submissionId: ID!
  authorId: ID!
  comment: String!
  mediaCommentId: String
  mediaCommentType: String
  groupCommentId: String
  hidden: Boolean
  draft: Boolean
  createdAt: DateTime
  updatedAt: DateTime

  author: User
  submission: Submission
  attachments: [File]
  mediaObject: Media
}

# ---------------------------------------------------------------------------
# Rubrics
# ---------------------------------------------------------------------------

"""
A rubric template used to assess assignments.
REST equivalent: GET /api/v1/courses/:course_id/rubrics/:id
"""
type Rubric implements Node & Timestamped {
  id: ID!
  courseId: ID
  accountId: ID
  title: String!
  description: String
  pointsPossible: Float
  reusable: Boolean
  readOnly: Boolean
  freeFormCriterionComments: Boolean
  hideScoreTotal: Boolean
  workflowState: WorkflowState!
  createdAt: DateTime
  updatedAt: DateTime

  criteria: [RubricCriterion]
  associations(first: Int, after: String): RubricAssociationConnection
}

"""A single criterion row within a rubric."""
type RubricCriterion {
  id: ID!
  description: String!
  longDescription: String
  pointsPossible: Float
  ignoreForScoring: Boolean
  masteryPoints: Float
  criterionUseRange: Boolean
  learningOutcomeId: ID
  ratings: [RubricRating]
}

"""A rating level within a rubric criterion."""
type RubricRating {
  id: ID!
  description: String!
  longDescription: String
  points: Float!
}

"""
Links a rubric to a specific assignment or other assessable object.
REST equivalent: GET /api/v1/courses/:course_id/rubrics/:rubric_id/associations/:id
"""
type RubricAssociation implements Node & Timestamped {
  id: ID!
  rubricId: ID!
  associationId: ID!
  associationType: String!
  useForGrading: Boolean
  summaryData: String
  purpose: String
  hideScoreTotal: Boolean
  hidePoints: Boolean
  hideOutcomeResults: Boolean
  bookmarked: Boolean
  createdAt: DateTime
  updatedAt: DateTime

  rubric: Rubric
}

"""
A completed rubric scoring event on a submission.
REST equivalent: GET /api/v1/courses/:course_id/rubrics/:rubric_id/assessments/:id
"""
type RubricAssessment implements Node & Timestamped {
  id: ID!
  rubricId: ID!
  rubricAssociationId: ID
  userId: ID!
  assessorId: ID!
  artifactId: ID
  artifactType: String
  score: Float
  assessmentType: String
  data: [RubricCriterionAssessment]
  createdAt: DateTime
  updatedAt: DateTime

  rubric: Rubric
  user: User
  assessor: User
}

"""Score and comment for one criterion within a rubric assessment."""
type RubricCriterionAssessment {
  criterionId: ID!
  points: Float
  comments: String
  commentsEnabled: Boolean
  descriptionOfExcellence: String
  description: String
}

# ---------------------------------------------------------------------------
# Grading
# ---------------------------------------------------------------------------

"""
A grading period (e.g., Quarter 1) within a grading period set.
REST equivalent: GET /api/v1/courses/:course_id/grading_periods/:id
"""
type GradingPeriod implements Node & Timestamped {
  id: ID!
  title: String!
  startDate: DateTime!
  endDate: DateTime!
  closeDate: DateTime
  weight: Float
  isClosed: Boolean
  isLast: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

"""
A grading standard (letter-grade scale).
REST equivalent: GET /api/v1/courses/:course_id/grading_standards/:id
"""
type GradingStandard implements Node & Timestamped {
  id: ID!
  title: String!
  contextType: String
  contextId: ID
  workflowState: WorkflowState!
  data: [GradingSchemeEntry]
  createdAt: DateTime
  updatedAt: DateTime
}

"""One row in a grading scheme (letter → minimum percentage)."""
type GradingSchemeEntry {
  name: String!
  value: Float!
}

# ---------------------------------------------------------------------------
# Quizzes
# ---------------------------------------------------------------------------

"""
A Classic Quizzes quiz (engine: quizzes.next for New Quizzes).
REST equivalent: GET /api/v1/courses/:course_id/quizzes/:id
"""
type Quiz implements Node & Timestamped {
  id: ID!
  courseId: ID!
  assignmentId: ID
  title: String!
  description: String
  quizType: String
  timeLimit: Int
  shuffleAnswers: Boolean
  showCorrectAnswers: Boolean
  showCorrectAnswersLastAttempt: Boolean
  showCorrectAnswersAt: DateTime
  hideCorrectAnswersAt: DateTime
  allowedAttempts: Int
  scoringPolicy: String
  oneQuestionAtATime: Boolean
  cantGoBack: Boolean
  accessCode: String
  ipFilter: String
  pointsPossible: Float
  questionCount: Int
  lockAt: DateTime
  unlockAt: DateTime
  dueAt: DateTime
  published: Boolean!
  workflowState: WorkflowState!
  htmlUrl: URL
  mobileUrl: URL
  createdAt: DateTime
  updatedAt: DateTime

  course: Course
  questions(first: Int, after: String): QuizQuestionConnection
  submissions(first: Int, after: String): QuizSubmissionConnection
}

"""
A question within a quiz.
REST equivalent: GET /api/v1/courses/:course_id/quizzes/:quiz_id/questions/:id
"""
type QuizQuestion implements Node {
  id: ID!
  quizId: ID!
  quizGroupId: ID
  assessmentQuestionId: ID
  position: Int
  questionName: String
  questionType: String!
  questionText: String
  pointsPossible: Float
  answers: [QuizAnswer]
  variables: JSON
  formulas: JSON
  answerTolerance: Float
  formulaDecimalPlaces: Int
  matchingAnswerIncorrectMatches: String
  textAfterAnswers: String
  correctComments: String
  incorrectComments: String
  neutralComments: String
}

"""A possible answer for a quiz question."""
type QuizAnswer {
  id: ID!
  text: String
  html: String
  comments: String
  commentsHtml: String
  weight: Float
  blank: String
  blankId: String
  matchId: ID
  left: String
  right: String
}

"""
A student's quiz submission attempt.
REST equivalent: GET /api/v1/courses/:course_id/quizzes/:quiz_id/submissions/:id
"""
type QuizSubmission implements Node & Timestamped {
  id: ID!
  quizId: ID!
  userId: ID!
  submissionId: ID
  startedAt: DateTime
  finishedAt: DateTime
  endAt: DateTime
  attempt: Int
  score: Float
  scoreBeforeRegrade: Float
  keptScore: Float
  fudgePoints: Float
  extraAttempts: Int
  extraTime: Int
  manuallyUnlocked: Boolean
  workflowState: WorkflowState!
  timeSpent: Int
  createdAt: DateTime
  updatedAt: DateTime

  quiz: Quiz
  user: User
}

# ---------------------------------------------------------------------------
# Discussions & Announcements
# ---------------------------------------------------------------------------

"""
A discussion topic in a course or group.
REST equivalent: GET /api/v1/courses/:course_id/discussion_topics/:id
"""
type Discussion implements Node & Timestamped {
  id: ID!
  courseId: ID
  groupId: ID
  title: String!
  message: String
  discussionType: DiscussionType
  requireInitialPost: Boolean
  allowRating: Boolean
  onlyGradersCanRate: Boolean
  sortByRating: Boolean
  published: Boolean!
  locked: Boolean!
  pinned: Boolean!
  podcastEnabled: Boolean
  podcastHasStudentPosts: Boolean
  subscribed: Boolean
  assignmentId: ID
  delayedPostAt: DateTime
  lockAt: DateTime
  workflowState: WorkflowState!
  htmlUrl: URL
  postedAt: DateTime
  lastReplyAt: DateTime
  participantCount: Int
  unreadCount: Int
  discussionSubentryCount: Int
  createdAt: DateTime
  updatedAt: DateTime

