# ---------------------------------------------------------------------------
# Modules & Pages
# ---------------------------------------------------------------------------

"""
A content module (sequential container of items).
REST equivalent: GET /api/v1/courses/:course_id/modules/:id
"""
type Module implements Node & Timestamped {
  id: ID!
  courseId: ID!
  name: String!
  position: Int
  prerequisiteModuleIds: [ID]
  requireSequentialProgress: Boolean
  publishFinalGrade: Boolean
  published: Boolean!
  workflowState: WorkflowState!
  completionRequirements: [ModuleCompletionRequirement]
  itemsCount: Int
  itemsUrl: URL
  createdAt: DateTime
  updatedAt: DateTime

  course: Course
  items(first: Int, after: String): ModuleItemConnection
}

"""Completion requirement rule for a module item."""
type ModuleCompletionRequirement {
  id: ID!
  type: String!
  minScore: Float
  completedAt: DateTime
}

"""
An item within a module (points to an Assignment, Quiz, Page, etc.).
REST equivalent: GET /api/v1/courses/:course_id/modules/:module_id/items/:id
"""
type ModuleItem implements Node {
  id: ID!
  moduleId: ID!
  title: String
  position: Int
  indent: Int
  type: ModuleItemType!
  contentId: ID
  htmlUrl: URL
  url: URL
  pageUrl: String
  externalUrl: URL
  newTab: Boolean
  published: Boolean
  workflowState: WorkflowState!
  completionRequirement: ModuleCompletionRequirement

  module: Module
  content: ModuleItemContent
}

"""Union of content types that can appear as a module item."""
union ModuleItemContent = Assignment | Quiz | Discussion | ContentPage | File | ExternalTool

"""
A wiki page (Canvas Page).
REST equivalent: GET /api/v1/courses/:course_id/pages/:url_or_id
"""
type ContentPage implements Node & Timestamped {
  id: ID!
  courseId: ID!
  url: String!
  title: String!
  body: String
  editingRoles: String
  revisionsCount: Int
  published: Boolean!
  hideFromStudents: Boolean
  frontPage: Boolean
  workflowState: WorkflowState!
  htmlUrl: URL
  createdAt: DateTime
  updatedAt: DateTime

  course: Course
  editor: User
}

