# ---------------------------------------------------------------------------
# Root Query
# ---------------------------------------------------------------------------

type Query {
  """Fetch any Node by its global opaque ID."""
  node(id: ID!): Node

  """The currently authenticated user."""
  self: User

  """Look up a course by its Canvas ID or SIS ID."""
  course(id: ID, sisId: String): Course

  """List courses visible to the current user."""
  allCourses(first: Int, after: String, state: [WorkflowState]): CourseConnection

  """Look up an account."""
  account(id: ID!): Account

  """Look up a user."""
  user(id: ID!): User

  """Look up an assignment."""
  assignment(id: ID!): Assignment

  """Look up a submission."""
  submission(id: ID!): Submission

  """Look up a quiz."""
  quiz(id: ID!): Quiz

  """Look up a discussion topic."""
  discussion(id: ID!): Discussion

  """Look up an outcome."""
  outcome(id: ID!): Outcome

  """Look up an enrollment term."""
  term(id: ID!): Term

  """Look up a group."""
  group(id: ID!): Group

  """Look up a Canvas file."""
  file(id: ID!): File

  """Look up a module."""
  module(id: ID!): Module

  """Look up a rubric."""
  rubric(id: ID!): Rubric
}

# ---------------------------------------------------------------------------
# Root Mutation
# ---------------------------------------------------------------------------

type Mutation {
  """Create a submission on behalf of the current user."""
  createSubmission(input: CreateSubmissionInput!): CreateSubmissionPayload

  """Post a grade on a submission (requires Manage Grades permission)."""
  postSubmissionGrade(input: PostSubmissionGradeInput!): PostSubmissionGradePayload

  """Mark a submission comment as read."""
  markSubmissionCommentRead(id: ID!): MarkSubmissionCommentReadPayload

  """Mark a discussion topic entry as read."""
  markDiscussionEntryRead(id: ID!): MarkDiscussionEntryReadPayload

  """Subscribe or unsubscribe from a discussion topic."""
  subscribeToDiscussion(topicId: ID!, subscribed: Boolean!): Discussion

  """Create a discussion entry reply."""
  createDiscussionEntry(input: CreateDiscussionEntryInput!): CreateDiscussionEntryPayload

  """Update a module item's position."""
  updateModuleItemPosition(moduleId: ID!, itemId: ID!, position: Int!): ModuleItem

  """Publish or unpublish a module."""
  updateModulePublishedStatus(id: ID!, published: Boolean!): Module
}

# ---------------------------------------------------------------------------
# Mutation input / payload types
# ---------------------------------------------------------------------------

input CreateSubmissionInput {
  assignmentId: ID!
  submissionType: SubmissionType!
  body: String
  url: URL
  fileIds: [ID]
  mediaCommentId: String
  mediaCommentType: String
  annotatedDocumentId: ID
}

type CreateSubmissionPayload {
  submission: Submission
  errors: [MutationError]
}

input PostSubmissionGradeInput {
  submissionId: ID!
  score: Float
  grade: String
  excused: Boolean
  comment: String
  attempt: Int
}

type PostSubmissionGradePayload {
  submission: Submission
  errors: [MutationError]
}

type MarkSubmissionCommentReadPayload {
  submissionComment: SubmissionComment
  errors: [MutationError]
}

type MarkDiscussionEntryReadPayload {
  discussionEntry: DiscussionEntry
  errors: [MutationError]
}

input CreateDiscussionEntryInput {
  discussionTopicId: ID!
  parentEntryId: ID
  message: String!
  fileIds: [ID]
}

type CreateDiscussionEntryPayload {
  discussionEntry: DiscussionEntry
  errors: [MutationError]
}

"""A field-level validation or authorization error returned from a mutation."""
type MutationError {
  attribute: String
  message: String!
  type: String
}
