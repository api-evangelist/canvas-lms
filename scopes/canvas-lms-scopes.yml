scope_notes: >-
  Canvas scopes are per-endpoint and dynamic: each is url:VERB|/api/v1/<path>.
  Developer keys are configured with the subset of scopes a token may request;
  when a developer key is set to "enforce scopes", tokens are restricted to the
  listed scopes. The full live list is enumerable via
  GET /api/v1/accounts/:account_id/scopes (group_by=resource_name). The scopes
  below are those the captured OpenAPI operations map to; the docs reference is
  the authoritative, install-specific source.
